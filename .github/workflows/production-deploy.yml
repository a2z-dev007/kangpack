name: Production CI/CD Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST || '82.112.227.42' }}
          username: ${{ secrets.HOSTINGER_USER || 'root' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            echo "🚀 [CI/CD] Starting Deployment on Hostinger VPS..."

            # Ensure Node, npm, and PM2 are in PATH
            export PATH=$PATH:/usr/local/bin:/usr/bin:$(npm config get prefix 2>/dev/null)/bin

            # Optional NVM load if installed
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
                . "$NVM_DIR/nvm.sh"
            fi

            # 1. Navigate to project root
            echo "📂 [CI/CD] Navigating to /var/www/kangpack..."
            cd /var/www/kangpack || { echo "❌ /var/www/kangpack directory not found!"; exit 1; }

            # 2. Synchronize code from main branch (protecting .env files & uploads)
            echo "🔄 [CI/CD] Pulling latest changes from GitHub main..."
            git fetch origin main
            git reset --hard origin/main
            # Clean untracked files except production environment files and uploads
            git clean -fd -e backend/.env.production -e frontend/.env.production -e backend/uploads/

            # 3. Build Backend
            echo "📦 [CI/CD] Installing backend dependencies & building..."
            cd backend
            npm install --prefer-offline --no-audit
            npm run build
            mkdir -p uploads logs
            cd ..

            # 4. Build Frontend (Next.js 15 Standalone)
            echo "⚡ [CI/CD] Installing frontend dependencies & building Next.js standalone..."
            cd frontend
            npm install --prefer-offline --no-audit
            NODE_OPTIONS="--max-old-space-size=1536" npm run build

            # Synchronize static assets into Next.js standalone folder
            echo "📂 [CI/CD] Syncing public and static assets to standalone directory..."
            mkdir -p .next/standalone/.next
            cp -r public .next/standalone/ 2>/dev/null || true
            cp -r .next/static .next/standalone/.next/ 2>/dev/null || true

            if [ -d ".next/standalone/frontend" ]; then
                mkdir -p .next/standalone/frontend/.next
                cp -r public .next/standalone/frontend/ 2>/dev/null || true
                cp -r .next/static .next/standalone/frontend/.next/ 2>/dev/null || true
            fi
            cd ..

            # 5. Zero-Downtime Reload with PM2
            echo "♻️ [CI/CD] Reloading applications with PM2..."
            pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js
            pm2 save

            # 6. Verify Health
            echo "🏥 [CI/CD] Running health checks..."
            sleep 4
            curl -I http://127.0.0.1:8000/api/v1/health || true
            curl -I http://127.0.0.1:3000 || true

            echo "✅ [CI/CD] Deployment successfully completed!"
